[package]
name = "pi-rs-gui"
version = "0.3.0"
description = "A Tauri v2 GUI for pi-coding-agent (Rust)"
authors = ["you"]
edition = "2021"

[lib]
name = "pi_rs_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pi-coding-agent = { git = "https://github.com/oouxx/pi-rs", tag = "v1.87.14"}
pi-agent-core = { git = "https://github.com/oouxx/pi-rs", tag = "v1.87.14"}
pi-ai = { git = "https://github.com/oouxx/pi-rs", tag = "v1.87.14"}
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
open = "5"
futures = "0.3"
url = "2"
ignore = "0.4"
portable-pty = "0.9"

[dev-dependencies]
tempfile = "3"
