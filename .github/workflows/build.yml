# Builds Tauri bundles for Linux / Windows / macOS on x86_64 and aarch64.
#
# Notes:
# - `ubuntu-24.04-arm` and `windows-11-arm` are GitHub-hosted ARM runners,
#   available for public repositories. For private repos, replace them with
#   cross-compilation jobs (Linux AppImage cannot be cross-compiled; use an
#   emulated ARM runner).
# - macOS x86_64 is cross-compiled on the arm64 `macos-latest` runner, matching
#   Tauri's official pipeline example.
# - Artifacts are unsigned. Add signing/notarization secrets for distribution.

name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            artifact: linux-x86_64
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb
            artifact: linux-aarch64

          # Windows
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x86_64
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
            artifact: windows-aarch64

          # macOS (x86_64 is cross-compiled on the arm64 runner)
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            artifact: macos-x86_64
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config patchelf xdg-utils \
            libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        run: bunx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          CI: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
